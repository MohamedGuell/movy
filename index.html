<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movy — Films & Séries Streaming Gratuit en HD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><polygon points='5 3 19 12 5 21 5 3'/></svg>">
  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #14161d;
      --surface-hover: #1c202c;
      --card-bg: #181b24;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #e50914;
      --primary-glow: rgba(229, 9, 20, 0.4);
      --accent: #6366f1;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 12, 15, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e50914, #b20710);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .brand-logo svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .brand span {
      background: linear-gradient(to right, #ffffff, #e50914);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-center {
      flex: 1;
      max-width: 580px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 9px 18px 9px 42px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Category Chips */
    .chips-container {
      display: flex;
      gap: 8px;
      padding: 16px 28px;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(20, 22, 29, 0.6);
      border-bottom: 1px solid var(--border);
    }

    .chips-container::-webkit-scrollbar { display: none; }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 3px 12px var(--primary-glow);
    }

    /* Hero Banner */
    .hero-banner {
      height: 380px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 32px 36px;
      background: #111;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      opacity: 0.45;
      filter: blur(1px);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, rgba(11, 12, 15, 0.75) 50%, rgba(11, 12, 15, 0.2) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
    }

    .hero-tag {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
    }

    .btn-play-hero {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-play-hero:hover {
      background: #b20710;
      transform: translateY(-2px);
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 24px 28px 60px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title span {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: normal;
    }

    /* Media Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .media-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .media-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6), 0 0 15px var(--primary-glow);
      border-color: rgba(229, 9, 20, 0.5);
    }

    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      background: #1f232d;
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .media-card:hover .poster-img {
      transform: scale(1.06);
    }

    .poster-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .badge-movie { color: #60a5fa; }
    .badge-tv { color: #a78bfa; }

    .rating-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fbbf24;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .media-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .media-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .media-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Player / Watch Modal */
    #player-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-y: auto;
    }

    .player-container {
      width: 100%;
      max-width: 1100px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      margin: auto 0;
    }

    .player-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
    }

    .player-title-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-title-info h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .player-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.15s ease;
    }

    .player-close-btn:hover {
      background: #e50914;
      color: #fff;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-controls-bar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .server-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .server-selector select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
    }

    /* TV Show Seasons & Episodes */
    .tv-controls {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .tv-controls select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
    }

    .player-details-pane {
      padding: 20px;
      display: flex;
      gap: 20px;
    }

    .details-poster {
      width: 100px;
      border-radius: 8px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      flex-shrink: 0;
    }

    .details-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .details-synopsis {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Episodes List in TV mode */
    .episodes-section {
      display: none;
      padding: 0 20px 20px;
      flex-direction: column;
      gap: 10px;
    }

    .episodes-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .ep-card {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .ep-card:hover, .ep-card.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Loading Spinner */
    .loading-wrap {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 14px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      header { padding: 0 16px; }
      .header-nav { display: none; }
      main { padding: 16px; }
      .hero-banner { height: 260px; padding: 20px; }
      .hero-title { font-size: 1.5rem; }
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .player-modal { padding: 8px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a class="brand" onclick="goHome()">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <span>Movy</span>
    </a>

    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Rechercher un film ou une série..." autocomplete="off" oninput="onSearchInput(this.value)">
      </div>
    </div>

    <div class="header-nav">
      <button class="nav-btn active" onclick="switchTab('trending', this)">Accueil</button>
      <button class="nav-btn" onclick="switchTab('movie', this)">Films</button>
      <button class="nav-btn" onclick="switchTab('tv', this)">Séries</button>
    </div>
  </header>

  <!-- Category Filter Chips -->
  <div class="chips-container" id="chips-bar">
    <button class="chip active" onclick="selectChip('trending', this)">🔥 Tendances</button>
    <button class="chip" onclick="selectChip('movies', this)">🎬 Films populaires</button>
    <button class="chip" onclick="selectChip('tv', this)">📺 Séries populaires</button>
    <button class="chip" onclick="selectChip('genre-28', this)">💥 Action</button>
    <button class="chip" onclick="selectChip('genre-35', this)">😂 Comédie</button>
    <button class="chip" onclick="selectChip('genre-878', this)">🚀 Science-Fiction</button>
    <button class="chip" onclick="selectChip('genre-27', this)">👻 Horreur</button>
    <button class="chip" onclick="selectChip('genre-16', this)">✨ Animation</button>
  </div>

  <!-- Hero Banner -->
  <div class="hero-banner" id="hero-banner">
    <img class="hero-bg" id="hero-bg" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-tag" id="hero-tag">À l'affiche</span>
      <h1 class="hero-title" id="hero-title">Chargement...</h1>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-actions">
        <button class="btn-play-hero" id="hero-play-btn" onclick="playHeroMedia()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Regarder maintenant
        </button>
      </div>
    </div>
  </div>

  <!-- Main View -->
  <main>
    <h2 class="section-title" id="feed-title">🔥 Tendances du moment</h2>
    <div class="media-grid" id="media-grid">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Chargement du catalogue de streaming...</p>
      </div>
    </div>
  </main>

  <!-- Player Modal -->
  <div id="player-modal">
    <div class="player-container">
      <div class="player-header">
        <div class="player-title-info">
          <h2 id="modal-title">Titre du média</h2>
        </div>
        <button class="player-close-btn" onclick="closePlayer()" title="Fermer (Echap)">✕</button>
      </div>

      <div class="video-viewport">
        <iframe id="video-frame" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>

      <div class="player-controls-bar">
        <div class="server-selector">
          <span>Serveur :</span>
          <select id="server-select" onchange="onServerChange(this.value)">
            <option value="vidlink">Serveur 1 (VidLink - Rapide & HD)</option>
            <option value="2embed">Serveur 2 (2Embed - Alternatif)</option>
            <option value="smashy">Serveur 3 (SmashyStream - Multi)</option>
          </select>
        </div>

        <div class="tv-controls" id="tv-controls">
          <select id="season-select" onchange="onSeasonChange(this.value)"></select>
          <select id="episode-select" onchange="onEpisodeChange(this.value)"></select>
        </div>
      </div>

      <div class="episodes-section" id="episodes-section">
        <div class="episodes-title">Épisodes de la saison</div>
        <div class="episodes-grid" id="episodes-grid"></div>
      </div>

      <div class="player-details-pane">
        <img class="details-poster" id="details-poster" src="" alt="">
        <div class="details-text">
          <div style="font-size: 0.85rem; color: #fbbf24; font-weight: bold;" id="details-rating">★ 0.0</div>
          <div style="font-size: 0.82rem; color: var(--text-muted);" id="details-date">Date de sortie</div>
          <p class="details-synopsis" id="details-overview">Synopsis...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Movy (Z-Stream) • Catalogue streaming autonome sur GitHub Pages • Aucun traçage</p>
  </footer>

  <script>
    const TMDB_KEY = '844dba0bfd8f3a4f3799f6130ef9e335';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_BASE = 'https://image.tmdb.org/t/p/original';

    let heroMedia = null;
    let currentMedia = null;
    let currentSeason = 1;
    let currentEpisode = 1;
    let searchTimeout = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadTrending();
    });

    // Helper: TMDB Fetch
    async function tmdbFetch(endpoint, params = {}) {
      const url = new URL(TMDB_BASE + endpoint);
      url.searchParams.set('api_key', TMDB_KEY);
      url.searchParams.set('language', 'fr-FR');
      for (const [k, v] of Object.entries(params)) {
        url.searchParams.set(k, v);
      }
      const res = await fetch(url.toString());
      if (!res.ok) throw new Error(`TMDB error ${res.status}`);
      return await res.json();
    }

    // Load Trending
    async function loadTrending() {
      showLoading();
      document.getElementById('feed-title').innerHTML = '🔥 Tendances du moment';
      try {
        const data = await tmdbFetch('/trending/all/day');
        const items = (data.results || []).filter(x => x.poster_path);
        if (items.length > 0 && !heroMedia) {
          setupHero(items[0]);
        }
        renderMedia(items);
      } catch (err) {
        showError('Impossible de charger les tendances.');
      }
    }

    // Load Movies
    async function loadMovies() {
      showLoading();
      document.getElementById('feed-title').innerHTML = '🎬 Films populaires';
      try {
        const data = await tmdbFetch('/movie/popular');
        const items = (data.results || []).map(x => ({ ...x, media_type: 'movie' })).filter(x => x.poster_path);
        renderMedia(items);
      } catch (err) {
        showError('Impossible de charger les films.');
      }
    }

    // Load TV Series
    async function loadTV() {
      showLoading();
      document.getElementById('feed-title').innerHTML = '📺 Séries populaires';
      try {
        const data = await tmdbFetch('/tv/popular');
        const items = (data.results || []).map(x => ({ ...x, media_type: 'tv' })).filter(x => x.poster_path);
        renderMedia(items);
      } catch (err) {
        showError('Impossible de charger les séries.');
      }
    }

    // Load Genre
    async function loadGenre(genreId, name) {
      showLoading();
      document.getElementById('feed-title').innerHTML = `🎭 Catégorie : ${name}`;
      try {
        const data = await tmdbFetch('/discover/movie', { with_genres: genreId, sort_by: 'popularity.desc' });
        const items = (data.results || []).map(x => ({ ...x, media_type: 'movie' })).filter(x => x.poster_path);
        renderMedia(items);
      } catch (err) {
        showError('Impossible de charger le genre.');
      }
    }

    // Search Media
    async function searchMedia(query) {
      if (!query.trim()) {
        loadTrending();
        return;
      }
      showLoading();
      document.getElementById('feed-title').innerHTML = `Résultats pour "${escapeHtml(query)}"`;
      try {
        const data = await tmdbFetch('/search/multi', { query: query.trim() });
        const items = (data.results || []).filter(x => x.poster_path && (x.media_type === 'movie' || x.media_type === 'tv'));
        if (items.length === 0) {
          document.getElementById('media-grid').innerHTML = '<div class="loading-wrap"><p>Aucun film ou série trouvé.</p></div>';
          return;
        }
        renderMedia(items);
      } catch (err) {
        showError('Erreur de recherche.');
      }
    }

    function onSearchInput(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchMedia(val);
      }, 400);
    }

    // Setup Hero Banner
    function setupHero(item) {
      heroMedia = item;
      const title = item.title || item.name;
      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-desc').textContent = item.overview || 'Regardez dès maintenant en streaming HD.';
      document.getElementById('hero-tag').textContent = item.media_type === 'tv' ? 'Série à l\'affiche' : 'Film à l\'affiche';
      if (item.backdrop_path) {
        document.getElementById('hero-bg').src = BACKDROP_BASE + item.backdrop_path;
      } else if (item.poster_path) {
        document.getElementById('hero-bg').src = IMG_BASE + item.poster_path;
      }
    }

    function playHeroMedia() {
      if (heroMedia) {
        openMedia(heroMedia);
      }
    }

    // Render Media Grid
    function renderMedia(items) {
      const grid = document.getElementById('media-grid');
      grid.innerHTML = '';
      items.forEach(item => {
        const type = item.media_type === 'tv' ? 'tv' : 'movie';
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || '').substring(0, 4);
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';

        const card = document.createElement('div');
        card.className = 'media-card';
        card.onclick = () => openMedia(item);

        card.innerHTML = `
          <div class="poster-wrap">
            <img class="poster-img" src="${IMG_BASE + item.poster_path}" alt="${escapeHtml(title)}" loading="lazy">
            <div class="poster-badge ${type === 'tv' ? 'badge-tv' : 'badge-movie'}">${type === 'tv' ? 'SÉRIE' : 'FILM'}</div>
            <div class="rating-badge">★ ${rating}</div>
          </div>
          <div class="media-info">
            <div class="media-title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
            <div class="media-meta">
              <span>${year || 'N/A'}</span>
              <span>HD</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Open Media in Player
    async function openMedia(item) {
      currentMedia = item;
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      const title = item.title || item.name;

      document.getElementById('modal-title').textContent = title;
      document.getElementById('details-overview').textContent = item.overview || 'Aucun synopsis disponible.';
      document.getElementById('details-rating').textContent = `★ ${item.vote_average ? item.vote_average.toFixed(1) : '—'} / 10`;
      document.getElementById('details-date').textContent = `Sortie : ${item.release_date || item.first_air_date || 'N/A'}`;
      document.getElementById('details-poster').src = item.poster_path ? (IMG_BASE + item.poster_path) : '';

      const tvControls = document.getElementById('tv-controls');
      const epSection = document.getElementById('episodes-section');

      if (type === 'tv') {
        tvControls.style.display = 'flex';
        epSection.style.display = 'flex';
        currentSeason = 1;
        currentEpisode = 1;
        await loadSeasons(item.id);
      } else {
        tvControls.style.display = 'none';
        epSection.style.display = 'none';
        updatePlayerSource();
      }

      const modal = document.getElementById('player-modal');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // Load Seasons for TV Show
    async function loadSeasons(tvId) {
      try {
        const details = await tmdbFetch(`/tv/${tvId}`);
        const seasons = (details.seasons || []).filter(s => s.season_number > 0);
        const seasonSelect = document.getElementById('season-select');
        seasonSelect.innerHTML = '';

        seasons.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.season_number;
          opt.textContent = `Saison ${s.season_number} (${s.episode_count} ép.)`;
          seasonSelect.appendChild(opt);
        });

        currentSeason = seasons[0]?.season_number || 1;
        await loadEpisodes(tvId, currentSeason);
      } catch (err) {
        console.error(err);
        updatePlayerSource();
      }
    }

    // Load Episodes for Selected Season
    async function loadEpisodes(tvId, seasonNum) {
      try {
        const seasonData = await tmdbFetch(`/tv/${tvId}/season/${seasonNum}`);
        const episodes = seasonData.episodes || [];
        const epSelect = document.getElementById('episode-select');
        const epGrid = document.getElementById('episodes-grid');
        epSelect.innerHTML = '';
        epGrid.innerHTML = '';

        episodes.forEach(ep => {
          const opt = document.createElement('option');
          opt.value = ep.episode_number;
          opt.textContent = `Ép. ${ep.episode_number} - ${ep.name || 'Épisode'}`;
          epSelect.appendChild(opt);

          const epCard = document.createElement('div');
          epCard.className = `ep-card ${ep.episode_number === currentEpisode ? 'active' : ''}`;
          epCard.textContent = `Épisode ${ep.episode_number}`;
          epCard.title = ep.name || `Épisode ${ep.episode_number}`;
          epCard.onclick = () => {
            currentEpisode = ep.episode_number;
            epSelect.value = ep.episode_number;
            document.querySelectorAll('.ep-card').forEach(c => c.classList.remove('active'));
            epCard.classList.add('active');
            updatePlayerSource();
          };
          epGrid.appendChild(epCard);
        });

        currentEpisode = 1;
        updatePlayerSource();
      } catch (err) {
        console.error(err);
        updatePlayerSource();
      }
    }

    function onSeasonChange(val) {
      currentSeason = parseInt(val, 10);
      if (currentMedia) {
        loadEpisodes(currentMedia.id, currentSeason);
      }
    }

    function onEpisodeChange(val) {
      currentEpisode = parseInt(val, 10);
      document.querySelectorAll('.ep-card').forEach(c => {
        c.classList.toggle('active', c.textContent.includes(`Épisode ${currentEpisode}`));
      });
      updatePlayerSource();
    }

    // Update Player Iframe
    function updatePlayerSource() {
      if (!currentMedia) return;
      const type = currentMedia.media_type === 'tv' ? 'tv' : 'movie';
      const id = currentMedia.id;
      const server = document.getElementById('server-select').value;
      const frame = document.getElementById('video-frame');

      let url = '';
      if (server === 'vidlink') {
        url = type === 'tv'
          ? `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}`
          : `https://vidlink.pro/movie/${id}`;
      } else if (server === '2embed') {
        url = type === 'tv'
          ? `https://www.2embed.cc/embedtv/${id}&s=${currentSeason}&e=${currentEpisode}`
          : `https://www.2embed.cc/embed/${id}`;
      } else if (server === 'smashy') {
        url = type === 'tv'
          ? `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${currentSeason}&episode=${currentEpisode}`
          : `https://embed.smashystream.com/playere.php?tmdb=${id}`;
      }

      frame.src = url;
    }

    function onServerChange() {
      updatePlayerSource();
    }

    function closePlayer() {
      const modal = document.getElementById('player-modal');
      modal.style.display = 'none';
      document.getElementById('video-frame').src = '';
      document.body.style.overflow = '';
      currentMedia = null;
    }

    // Tabs & Chips
    function switchTab(tab, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));

      if (tab === 'trending') loadTrending();
      else if (tab === 'movie') loadMovies();
      else if (tab === 'tv') loadTV();
    }

    function selectChip(type, btn) {
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (type === 'trending') loadTrending();
      else if (type === 'movies') loadMovies();
      else if (type === 'tv') loadTV();
      else if (type === 'genre-28') loadGenre(28, 'Action');
      else if (type === 'genre-35') loadGenre(35, 'Comédie');
      else if (type === 'genre-878') loadGenre(878, 'Science-Fiction');
      else if (type === 'genre-27') loadGenre(27, 'Horreur');
      else if (type === 'genre-16') loadGenre(16, 'Animation');
    }

    function goHome() {
      document.getElementById('search-input').value = '';
      document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', i === 0));
      loadTrending();
    }

    function showLoading() {
      document.getElementById('media-grid').innerHTML = `
        <div class="loading-wrap">
          <div class="spinner"></div>
          <p>Chargement des titres...</p>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('media-grid').innerHTML = `
        <div class="loading-wrap">
          <p>${escapeHtml(msg)}</p>
          <button style="background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;" onclick="loadTrending()">Réessayer</button>
        </div>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Keyboard Shortcuts: Escape to close player
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('player-modal');
        if (modal.style.display === 'flex') {
          closePlayer();
        }
      }
    });
  </script>
</body>
</html>
